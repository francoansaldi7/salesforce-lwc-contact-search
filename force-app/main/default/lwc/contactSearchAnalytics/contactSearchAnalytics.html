<template>
    <lightning-card>
        <!-- Custom centered header -->
        <div slot="title" class="card-header">
            <lightning-icon
                icon-name="utility:chart"
                size="small"
                class="header-icon">
            </lightning-icon>
            <span class="header-title">Search Analytics</span>
        </div>

        <div class="analytics-container">
            <div class="metric">
                <span class="label">Searches</span>
                <span class="value">{searchCount}</span>
            </div>

            <div class="metric">
                <span class="label">Last Term</span>
                <span class="value">{lastSearchTerm}</span>
            </div>

            <div class="metric">
                <span class="label">Session</span>
                <span class="value">{sessionTime}s</span>
            </div>
        </div>
    </lightning-card>
</template>
